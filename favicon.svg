<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 202" width="202" height="202">
  <!-- The Notation mark, drawn black on a light tab strip and white on a dark
       one: the browser's colour scheme decides. Browsers that do not take SVG
       favicons fall back to favicon.png. -->
  <style>@media (prefers-color-scheme: dark) { image { filter: invert(1); } }</style>
  <image width="202" height="202" href="data:image/png;base64,"/>
</svg>
